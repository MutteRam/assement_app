<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Python Assessment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .home {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .box {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        .start-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .start-btn:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="home">

        <div class="box">

            <h1>
                Python Programming Assessment
            </h1>

            <p>
                Test your Python programming skills
            </p>

            <a href="{% url 'assessment' %}"
               class="start-btn">
                Start Assessment
            </a>

        </div>

    </div>

</body>

</html>
